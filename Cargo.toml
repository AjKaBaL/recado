[package]
name = "recado"
version = "1.0.0"
authors = ["AjKaBaL"]
description = "Recado: a private, local WhatsApp assistant that reminds you of what matters."
license = "MIT"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
qrcode = "0.14.1"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.5", features = ["json"] }
whatsapp-rust = { version = "0.7", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "ureq-client", "tokio-native", "signal"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26.1"
tauri-winrt-notification = "0.7"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
# Tira a tabela de símbolos (o .exe fica bem menor e sem caminhos desta máquina).
strip = true
